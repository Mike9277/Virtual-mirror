#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Load virtual hosts (flask-test.conf, node-test.conf)
    include /opt/nginx-pqc/conf/sites-enabled/*;

    sendfile        on;
    keepalive_timeout  65;

    # --- WebSocket helper for HMR ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Default HTTP server on port 80 (optional, can stay as-is or be removed)
    server {
        listen       80;
        server_name  localhost;

        location / {
            root   html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # You do NOT need another TLS server here; TLS is handled in
    # flask-test.conf (port 4000) and node-test.conf (port 5000).
}
